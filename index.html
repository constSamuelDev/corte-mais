<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre ou crie sua conta no Corte Mais">
    <title>Corte Mais | Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="pagina-login">
        <header class="marca">
            <div class="icone-marca" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="6" cy="6" r="3"></circle>
                    <circle cx="6" cy="18" r="3"></circle>
                    <path d="m8.1 8.1 11.8 11.8M20 4 8.1 15.9M12 12l3-3"></path>
                </svg>
            </div>
            <div class="texto-marca"><h1>CORTE MAIS</h1></div>
        </header>

        <div class="decoracao-tesoura" aria-hidden="true">✂</div>

        <section class="cartao-login">
            <div class="cabecalho-login">
                <span class="rotulo-login">ACESSO AO CORTE MAIS</span>
                <h2 id="titulo-acesso">Sua rotina,<br><span>no seu ritmo.</span></h2>
                <p id="descricao-acesso">Entre para encontrar barbeiros, acompanhar novidades e organizar seus horários.</p>
            </div>

            <div class="tipo-acesso" role="tablist" aria-label="Tipo de conta">
                <button type="button" class="opcao-acesso ativo" role="tab" aria-selected="true" data-role="barber">Sou barbeiro</button>
                <button type="button" class="opcao-acesso" role="tab" aria-selected="false" data-role="customer">Sou cliente</button>
            </div>

            <div class="modo-acesso" role="group" aria-label="Ação da conta">
                <button type="button" class="modo-acesso-ativo" id="modo-entrar">Entrar</button>
                <button type="button" id="modo-criar">Criar conta</button>
            </div>

            <form class="formulario-login" id="formulario-acesso">
                <div class="grupo-formulario campo-cadastro" id="campo-nome" hidden>
                    <label for="full-name">Nome</label>
                    <input type="text" id="full-name" name="full_name" autocomplete="name" maxlength="100">
                </div>
                <div class="grupo-formulario campo-cadastro" id="campo-barbearia" hidden>
                    <label for="shop-name">Nome da barbearia</label>
                    <input type="text" id="shop-name" name="shop_name" maxlength="100">
                </div>
                <div class="grupo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" autocomplete="email" required>
                </div>
                <div class="grupo-formulario">
                    <label for="password">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="password" name="password" placeholder="Mínimo de 8 caracteres" autocomplete="current-password" minlength="8" required>
                    </div>
                </div>

                <div class="opcoes-formulario" id="opcoes-login">
                    <span class="dica-senha">Use pelo menos 8 caracteres.</span>
                    <button type="button" class="esqueci-senha" id="recuperar-senha">Esqueci minha senha</button>
                </div>

                <p class="erro-login" id="status-acesso" role="status" aria-live="polite" hidden></p>
                <button type="button" class="esqueci-senha" id="reenviar-confirmacao" hidden>Reenviar e-mail de confirmação</button>
                <button type="submit" class="botao-login" id="botao-acesso">
                    <span>Entrar no Corte Mais</span>
                    <span class="seta" aria-hidden="true">→</span>
                </button>
            </form>

            <div class="mensagem-seguranca">
                <span aria-hidden="true">✓</span>
                <span>Seus dados ficam protegidos pela sua conta</span>
            </div>
        </section>
    </main>
    <script type="module" src="index.js"></script>
</body>

</html>
