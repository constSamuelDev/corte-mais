<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Área de clientes e barbeiros do Corte Mais">
    <title>Corte Mais | Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="app-brand" href="home.html"><span aria-hidden="true">✂</span> CORTE MAIS</a>
            <div class="app-user">
                <span id="user-name">Carregando...</span>
                <button class="button button-quiet" id="sign-out" type="button">Sair</button>
            </div>
        </header>
        <nav class="app-nav" id="app-nav" aria-label="Navegação principal"></nav>
        <main class="app-main" id="app-main" tabindex="-1">
            <p class="loading-state">Carregando sua conta...</p>
        </main>
    </div>
    <dialog id="app-dialog" class="app-dialog"></dialog>
    <div id="app-notice" class="app-notice" role="status" aria-live="polite"></div>
    <script type="module" src="home.js"></script>
</body>

</html>
